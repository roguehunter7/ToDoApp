<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseTask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <style>
    @layer reset, theme, base, components;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { min-height: 100dvh; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      input, button { font: inherit; }
      button { cursor: pointer; line-height: 1; }
      ul { list-style: none; }
    }

    @layer theme {
      :root {
        --surface-0: #0a0a0f;
        --surface-1: #111118;
        --surface-2: #181825;
        --surface-3: #1e1e30;
        --border: #2a2a40;
        --border-hover: #3a3a55;
        --text: #e4e4ed;
        --text-muted: #7c7c94;
        --text-dim: #55556b;
        --accent: #34d399;
        --accent-glow: rgba(52, 211, 153, .15);
        --cyan: #22d3ee;
        --cyan-glow: rgba(34, 211, 238, .12);
        --red: #f87171;
        --red-glow: rgba(248, 113, 113, .12);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: .2s cubic-bezier(.4, 0, .2, 1);
        --bounce: .45s cubic-bezier(.34, 1.56, .64, 1);

      }
    }

    @layer base {
      body { background: var(--surface-0); color: var(--text); -webkit-font-smoothing: antialiased; }
      ::selection { background: var(--accent); color: var(--surface-0); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px var(--surface-2) inset; -webkit-text-fill-color: var(--text); }
    }

    @layer components {
      .app { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }

      /* === Auth screen === */
      .auth-screen {
        display: flex; align-items: center; justify-content: center;
        min-height: 100dvh; padding: 24px 16px;
      }

      .auth-card {
        width: 100%; max-width: 400px;
        background: var(--surface-1); border: 1px solid var(--border);
        border-radius: 16px; padding: 40px 32px 32px;
      }

      .auth-logo {
        text-align: center; margin-bottom: 8px;
        font-size: 28px; font-weight: 800; letter-spacing: -.03em;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .auth-sub {
        text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 28px;
      }

      .auth-error {
        padding: 10px 14px; background: var(--red-glow); border: 1px solid rgba(248,113,113,.25);
        border-radius: var(--radius-sm); color: var(--red); font-size: 12px; margin-bottom: 16px;
        display: none; line-height: 1.4;
      }

      .auth-field {
        margin-bottom: 14px;
      }

      .auth-field label {
        display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
        margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
      }

      .auth-field input {
        width: 100%; padding: 12px 14px;
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
        outline: none; transition: var(--transition);
      }

      .auth-field input:focus {
        border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .auth-submit {
        width: 100%; padding: 12px;
        background: var(--accent); color: var(--surface-0);
        border: none; border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 700;
        transition: var(--transition); margin-top: 4px;
      }

      .auth-submit:hover { filter: brightness(1.1); }
      .auth-submit:disabled { opacity: .4; cursor: not-allowed; filter: none; }

      .auth-toggle {
        text-align: center; margin-top: 16px;
        font-size: 13px; color: var(--text-muted);
      }

      .auth-toggle button {
        background: none; border: none; color: var(--accent); font-weight: 600;
        font-size: 13px; transition: var(--transition);
      }
      .auth-toggle button:hover { color: var(--cyan); }

      .auth-divider {
        height: 1px; background: var(--border); margin: 18px 0;
      }

      /* === App header === */
      .topbar {
        display: flex; align-items: center; gap: 12px;
        margin-bottom: 24px; position: relative;
      }

      .topbar-left { display: flex; align-items: center; gap: 10px; }

      .topbar-logo {
        font-size: 20px; font-weight: 800; letter-spacing: -.03em;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .topbar-right { margin-left: auto; position: relative; }

      .user-btn {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 10px 6px 6px;
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 100px; transition: var(--transition);
        font-size: 12px; color: var(--text-muted); font-weight: 500;
      }

      .user-btn:hover { border-color: var(--border-hover); background: var(--surface-3); }

      .user-avatar {
        width: 28px; height: 28px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        color: var(--surface-0); font-size: 13px; font-weight: 700;
      }

      .user-email { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Dropdown */
      .dropdown {
        position: absolute; top: calc(100% + 6px); right: 0;
        min-width: 200px; z-index: 50;
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.5);
        overflow: hidden; display: none;
      }

      .dropdown.open { display: block; }

      .dropdown-header {
        padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
      }

      .dropdown-email {
        font-size: 13px; font-weight: 600; color: var(--text); word-break: break-all;
      }

      .dropdown-role {
        font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 2px;
      }

      .dropdown-item {
        display: flex; align-items: center; gap: 8px;
        width: 100%; padding: 10px 14px;
        background: none; border: none; color: var(--text-muted);
        font-size: 13px; font-weight: 500; transition: var(--transition);
        text-align: left;
      }

      .dropdown-item:hover { background: var(--surface-3); color: var(--text); }
      .dropdown-item.danger { color: var(--red); }
      .dropdown-item.danger:hover { background: var(--red-glow); }

      .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

      /* === Stats === */
      .stats { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
      .stat {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 14px; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--text-muted);
        transition: var(--transition);
      }
      .stat[data-count="0"] { opacity: .55; }
      .stat-badge {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
        font-size: 11px; font-weight: 700; transition: var(--bounce);
      }
      .stat-badge[data-type="done"] { background: var(--accent-glow); color: var(--accent); }
      .stat-badge[data-type="pending"] { background: var(--cyan-glow); color: var(--cyan); }

      .progress-ring {
        display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim);
        margin-left: auto;
      }
      .progress-ring svg { transform: rotate(-90deg); }

      /* === Input === */
      .input-area { display: flex; gap: 8px; margin-bottom: 24px; }
      .input-wrap {
        flex: 1; position: relative; display: flex; align-items: center;
        background: var(--surface-1); border: 1px solid var(--border);
        border-radius: var(--radius); transition: var(--transition);
      }
      .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
      .input-wrap input {
        flex: 1; background: transparent; border: none; outline: none;
        padding: 14px 16px; color: var(--text); font-size: 14px; font-weight: 400;
      }
      .input-wrap input::placeholder { color: var(--text-dim); }
      .input-hint {
        display: flex; align-items: center; gap: 4px; padding-right: 12px;
        color: var(--text-dim); font-size: 11px; font-weight: 500;
      }
      .input-hint kbd {
        padding: 2px 5px; background: var(--surface-3); border: 1px solid var(--border);
        border-radius: 4px; font-size: 10px; font-family: inherit; color: var(--text-muted);
      }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        padding: 14px 20px; border: none; border-radius: var(--radius);
        font-size: 14px; font-weight: 600; transition: var(--transition); white-space: nowrap;
      }
      .btn-primary { background: var(--accent); color: var(--surface-0); }
      .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .btn-primary:active { transform: translateY(0); }
      .btn-icon {
        width: 32px; height: 32px; padding: 0;
        background: transparent; border: 1px solid transparent;
        border-radius: var(--radius-sm); color: var(--text-dim);
        font-size: 16px; line-height: 1; transition: var(--transition);
      }
      .btn-icon:hover { background: var(--surface-3); color: var(--text-muted); }
      .btn-icon.danger:hover { background: var(--red-glow); color: var(--red); }
      .btn-outline {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 16px; background: transparent; border: 1px solid var(--border);
        border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13px; font-weight: 600;
        transition: var(--transition);
      }
      .btn-outline:hover { border-color: var(--border-hover); color: var(--text); }
      .btn-outline.danger { color: var(--red); }
      .btn-outline.danger:hover { background: var(--red-glow); border-color: transparent; }

      /* === Dashboard === */
      .dashboard { display: grid; grid-template-columns: 1fr; gap: 24px; }
      @media (width >= 768px) { .dashboard { grid-template-columns: 1fr 1fr; } }

      .column { display: flex; flex-direction: column; gap: 2px; }
      .column-header {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 4px 16px; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
        border-bottom: 1px solid var(--border); margin-bottom: 12px;
      }
      .column-header .count {
        margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-dim);
      }
      .column-header .icon { font-size: 16px; }

      /* Items */
      .item-list { display: flex; flex-direction: column; gap: 6px; }
      .item {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px; background: var(--surface-1); border: 1px solid var(--border);
        border-radius: var(--radius); transition: var(--transition);
        @starting-style { opacity: 0; transform: translateY(8px) scale(.97); }
      }
      .item:hover { border-color: var(--border-hover); background: var(--surface-2); }
      .item-text { flex: 1; font-size: 14px; line-height: 1.45; word-break: break-word; min-width: 0; }
      .item-meta { font-size: 11px; color: var(--text-dim); white-space: nowrap; font-weight: 500; }

      .item.pending .item-check {
        appearance: none; width: 20px; height: 20px; flex-shrink: 0;
        border: 2px solid var(--border-hover); border-radius: 6px;
        background: var(--surface-2); cursor: pointer; transition: var(--transition);
        position: relative; display: flex; align-items: center; justify-content: center;
      }
      .item.pending .item-check:checked { background: var(--accent); border-color: var(--accent); }
      .item.pending .item-check:checked::after {
        content: ''; width: 6px; height: 10px;
        border: solid var(--surface-0); border-width: 0 2px 2px 0;
        transform: rotate(45deg); position: absolute; top: 2px;
      }
      .item.pending .item-check:hover { border-color: var(--accent); }

      .item.done { opacity: .85; }
      .item.done .item-text { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; }
      .item.done .item-marker {
        width: 20px; height: 20px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border-radius: 6px; background: var(--accent-glow); font-size: 11px;
      }

      /* Empty */
      .empty {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 48px 24px; text-align: center; gap: 12px;
      }
      .empty svg { opacity: .3; }
      .empty-text { color: var(--text-dim); font-size: 13px; font-weight: 500; }
      .empty-sub { color: var(--text-dim); font-size: 12px; opacity: .65; }

      /* Toast */
      .toast-container {
        position: fixed; bottom: 24px; left: 50%; translate: -50% 0;
        z-index: 100; display: flex; flex-direction: column; gap: 8px;
        pointer-events: none;
      }
      .toast {
        padding: 12px 20px; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text);
        box-shadow: 0 8px 32px rgba(0,0,0,.5); pointer-events: auto;
        animation: toast-in var(--bounce), toast-out .25s ease forwards;
        animation-duration: var(--bounce), .25s;
        animation-delay: 0s, 2.5s;
        animation-fill-mode: forwards, forwards;
      }
      .toast.done { border-left: 3px solid var(--accent); }
      .toast.added { border-left: 3px solid var(--cyan); }
      .toast.deleted { border-left: 3px solid var(--red); }

      @keyframes toast-in { from { opacity: 0; transform: translateY(16px) scale(.92); } }
      @keyframes toast-out { to { opacity: 0; transform: translateY(-8px) scale(.95); } }



      /* Loading spinner */
      .spinner {
        width: 24px; height: 24px; border: 2px solid var(--border);
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin .6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* === Week strip === */
      .week-strip {
        display: flex; align-items: center; gap: 2px;
        margin-bottom: 16px; user-select: none;
      }
      .week-nav {
        background: none; border: none; color: var(--text-dim);
        font-size: 16px; padding: 6px 10px; cursor: pointer;
        border-radius: var(--radius-sm); transition: var(--transition);
        flex-shrink: 0;
      }
      .week-nav:hover { color: var(--text); background: var(--surface-2); }
      .week-label {
        font-size: 12px; font-weight: 600; color: var(--text-muted);
        padding: 0 8px; white-space: nowrap; flex-shrink: 0;
      }
      .week-days {
        display: flex; gap: 2px; flex: 1; justify-content: center;
      }
      .day-pill {
        display: flex; flex-direction: column; align-items: center;
        gap: 1px; padding: 7px 0; min-width: 42px;
        background: transparent; border: 1px solid transparent;
        border-radius: var(--radius-sm); color: var(--text-muted);
        font-size: 10px; font-weight: 500; cursor: pointer;
        transition: var(--transition); position: relative;
      }
      .day-pill .day-num {
        font-size: 14px; font-weight: 600; line-height: 1;
      }
      .day-pill:hover { background: var(--surface-2); border-color: var(--border); }
      .day-pill.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
      .day-pill.today:not(.active) { color: var(--cyan); }
      .day-pill.today:not(.active) .day-num { font-weight: 700; }
      .day-dot {
        width: 4px; height: 4px; border-radius: 50%;
        background: var(--border-hover); margin-top: 1px;
        transition: var(--transition);
      }
      .day-pill.active .day-dot { background: var(--accent); }
      .day-pill.today:not(.active) .day-dot { background: var(--cyan); }

      .date-input {
        padding: 14px 12px; background: var(--surface-1);
        border: 1px solid var(--border); border-radius: var(--radius);
        color: var(--text); font-size: 13px; cursor: pointer;
        outline: none; transition: var(--transition); max-width: 140px;
        color-scheme: dark;
      }
      .date-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    }
  </style>
</head>
<body>
  <!-- Auth screen (shown when logged out) -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="auth-logo">PulseTask</div>
      <p class="auth-sub" id="authSub">Sign in to continue</p>

      <div class="auth-error" id="authError"></div>

      <form id="authForm">
        <div class="auth-field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>
        <button class="auth-submit" id="authSubmit" type="submit">Sign In</button>
      </form>

      <div class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span>
        <button id="authToggleBtn">Sign Up</button>
      </div>
    </div>
  </div>

  <!-- App (shown when logged in) -->
  <div id="app" class="app" style="display:none">
    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">PulseTask</span>
      </div>
      <div class="topbar-right">
        <button class="user-btn" id="userBtn">
          <span class="user-avatar" id="userAvatar">?</span>
          <span class="user-email" id="userEmail">user@email.com</span>
          <span style="font-size:10px">▾</span>
        </button>
        <div class="dropdown" id="userDropdown">
          <div class="dropdown-header">
            <div class="dropdown-email" id="dropEmail">user@email.com</div>
            <div class="dropdown-role" id="dropRole" style="display:none">Admin</div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="signOutBtn">
            <span>🚪</span> Sign Out
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="deleteAccountBtn">
            <span>🗑</span> Delete Account
          </button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat" id="statDone">
        <span>✅</span> Done today <span class="stat-badge" id="doneBadge" data-type="done">0</span>
      </div>
      <div class="stat" id="statPending">
        <span>📋</span> Left to do <span class="stat-badge" id="pendingBadge" data-type="pending">0</span>
      </div>
      <div class="progress-ring">
        <svg width="28" height="28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle id="progressArc" cx="14" cy="14" r="11" fill="none"
            stroke="url(#prog-grad)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="69.1" stroke-dashoffset="69.1"/>
          <defs><linearGradient id="prog-grad" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--cyan)"/>
          </linearGradient></defs>
        </svg>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <!-- Week strip -->
    <div class="week-strip">
      <button class="week-nav" id="weekPrev" title="Previous week">‹</button>
      <span class="week-label" id="weekLabel">Jul 21 – Jul 27, 2026</span>
      <div class="week-days" id="weekDays"></div>
      <button class="week-nav" id="weekNext" title="Next week">›</button>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap">
        <input id="taskInput" type="text"
          placeholder='Type a task… or use "did:", "x:", "/done " to log an activity'
          autofocus>
        <div class="input-hint">
          <kbd>⌘K</kbd> <kbd>↵</kbd>
        </div>
      </div>
      <input type="date" id="taskDate" class="date-input" title="Schedule for date">
      <button class="btn btn-primary" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add
      </button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
      <div class="column">
        <div class="column-header">
          <span class="icon">✅</span> <span id="doneColTitle">What I Did Today</span>
          <span class="count" id="doneCount">0</span>
        </div>
        <div class="item-list" id="completedList"></div>
      </div>
      <div class="column">
        <div class="column-header">
          <span class="icon">📋</span> <span id="pendingColTitle">Scheduled</span>
          <span class="count" id="pendingCount">0</span>
        </div>
        <div class="item-list" id="pendingList"></div>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loadingScreen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-0);z-index:999">
    <div class="spinner"></div>
  </div>

  <!-- Confirm modal (hidden) -->
  <dialog id="confirmDialog" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:380px;width:90vw">
    <p id="confirmMsg" style="font-size:14px;line-height:1.5;margin-bottom:20px;font-weight:500"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-outline" id="confirmCancel">Cancel</button>
      <button class="btn-outline danger" id="confirmOk">Delete</button>
    </div>
  </dialog>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    {
    const supabase = window.supabase.createClient(
      'https://rqhrsildsoxeadchozui.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaHJzaWxkc294ZWFkY2hvenVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzEwODUsImV4cCI6MjEwMDU0NzA4NX0.SyzfABMYO2APB-zpZp3FYHv2kKLOXEiUjIdlP3V3VzU'
    );

    // DOM refs
    const $ = id => document.getElementById(id);
    const authScreen = $('authScreen');
    const appEl = $('app');
    const loadingScreen = $('loadingScreen');
    const authForm = $('authForm');
    const authEmail = $('authEmail');
    const authPassword = $('authPassword');
    const authSubmit = $('authSubmit');
    const authError = $('authError');
    const authToggleBtn = $('authToggleBtn');
    const authToggleText = $('authToggleText');
    const authSub = $('authSub');
    const userBtn = $('userBtn');
    const userAvatar = $('userAvatar');
    const userEmail = $('userEmail');
    const userDropdown = $('userDropdown');
    const dropEmail = $('dropEmail');
    const dropRole = $('dropRole');
    const signOutBtn = $('signOutBtn');
    const deleteAccountBtn = $('deleteAccountBtn');
    const taskInput = $('taskInput');
    const addBtn = $('addBtn');
    const completedList = $('completedList');
    const pendingList = $('pendingList');
    const doneCount = $('doneCount');
    const pendingCount = $('pendingCount');
    const doneBadge = $('doneBadge');
    const pendingBadge = $('pendingBadge');
    const progressArc = $('progressArc');
    const progressPct = $('progressPct');
    const toastContainer = $('toastContainer');
    const confirmDialog = $('confirmDialog');
    const confirmMsg = $('confirmMsg');
    const confirmCancel = $('confirmCancel');
    const confirmOk = $('confirmOk');


    let isSignup = false;
    let currentUser = null;
    let isAdmin = false;
    let confirmResolve = null;
    let realtimeChannel = null;

    // Calendar state
    const today = () => new Date().toISOString().slice(0, 10);
    let selectedDate = today();
    let weekOffset = 0;

    const taskDate = $('taskDate');
    const weekDays = $('weekDays');
    const weekLabel = $('weekLabel');
    const weekPrev = $('weekPrev');
    const weekNext = $('weekNext');
    const doneColTitle = $('doneColTitle');
    const pendingColTitle = $('pendingColTitle');

    function fmtDateLabel(d) {
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function fmtDateFull(d) {
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function weekStart(offset) {
      const d = new Date();
      d.setDate(d.getDate() - d.getDay() + 1 + offset * 7); // Monday start
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function renderWeekStrip(taskDates) {
      const start = weekStart(weekOffset);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      weekLabel.textContent = `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

      weekDays.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        const ds = d.toISOString().slice(0, 10);
        const hasTasks = taskDates && taskDates.has(ds);
        const isToday = ds === today();
        const isActive = ds === selectedDate;

        const pill = document.createElement('button');
        pill.className = 'day-pill' +
          (isActive ? ' active' : '') +
          (isToday ? ' today' : '');
        pill.innerHTML = `<span class="day-num">${d.getDate()}</span>${d.toLocaleDateString('en-US', { weekday: 'short' })}` +
          (hasTasks ? '<span class="day-dot"></span>' : '<span class="day-dot" style="visibility:hidden"></span>');
        pill.addEventListener('click', () => {
          selectedDate = ds;
          taskDate.value = ds;
          loadItems();
        });
        weekDays.appendChild(pill);
      }
    }

    function navigateWeek(dir) {
      weekOffset += dir;
      loadItems();
    }

    weekPrev.addEventListener('click', () => navigateWeek(-1));
    weekNext.addEventListener('click', () => navigateWeek(1));
    taskDate.addEventListener('change', () => {
      if (taskDate.value) {
        selectedDate = taskDate.value;
        // Align week offset to include selected date
        const sel = new Date(selectedDate + 'T00:00:00');
        const ws = weekStart(weekOffset);
        const we = new Date(ws); we.setDate(we.getDate() + 6);
        if (sel < ws || sel > we) {
          const days = Math.floor((sel - weekStart(0)) / (1000 * 60 * 60 * 24));
          weekOffset = Math.floor(days / 7);
        }
        loadItems();
      }
    });
    taskDate.value = selectedDate;

    // === Helpers ===
    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function fmtRel(ts) {
      if (!ts) return '';
      const diff = Date.now() - new Date(ts).getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return `${Math.round(diff / 60000)}m ago`;
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function toast(msg, type = 'done') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.style.display = 'block';
    }

    function hideAuthError() { authError.style.display = 'none'; }

    function setLoading(on) {
      loadingScreen.style.display = on ? 'flex' : 'none';
    }

    function showConfirm(msg) {
      confirmMsg.textContent = msg;
      confirmDialog.showModal();
      return new Promise(resolve => { confirmResolve = resolve; });
    }

    confirmCancel.addEventListener('click', () => { confirmDialog.close(); if (confirmResolve) confirmResolve(false); });
    confirmOk.addEventListener('click', () => { confirmDialog.close(); if (confirmResolve) confirmResolve(true); });
    confirmDialog.addEventListener('close', () => { if (confirmResolve) { confirmResolve(false); confirmResolve = null; } });

    // === Auth state ===
    function showAuth() {
      authScreen.style.display = 'flex';
      appEl.style.display = 'none';
      hideAuthError();
    }

    function showApp() {
      authScreen.style.display = 'none';
      appEl.style.display = 'block';
      taskInput.focus();
    }

    function updateUserUI(user) {
      const email = user.email || 'user';
      userAvatar.textContent = email[0].toUpperCase();
      userEmail.textContent = email;
      dropEmail.textContent = email;
      // Check admin status separately (we'll call checkAdmin after)
    }

    function setAdminUI(admin) {
      isAdmin = admin;
      dropRole.style.display = admin ? 'block' : 'none';
    }

    // Toggle auth mode
    authToggleBtn.addEventListener('click', () => {
      isSignup = !isSignup;
      hideAuthError();
      if (isSignup) {
        authSub.textContent = 'Create your account';
        authSubmit.textContent = 'Sign Up';
        authToggleText.textContent = 'Already have an account?';
        authToggleBtn.textContent = 'Sign In';
        authPassword.setAttribute('autocomplete', 'new-password');
      } else {
        authSub.textContent = 'Sign in to continue';
        authSubmit.textContent = 'Sign In';
        authToggleText.textContent = 'Don\'t have an account?';
        authToggleBtn.textContent = 'Sign Up';
        authPassword.setAttribute('autocomplete', 'current-password');
      }
    });

    // Auth form submit
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAuthError();
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || password.length < 6) {
        showAuthError('Password must be at least 6 characters');
        return;
      }

      authSubmit.disabled = true;
      authSubmit.textContent = isSignup ? 'Creating…' : 'Signing in…';

      try {
        let result;
        if (isSignup) {
          result = await supabase.auth.signUp({ email, password });
          if (result.error) throw result.error;
          if (result.data?.user?.identities?.length === 0) {
            showAuthError('An account with this email already exists. Sign in instead.');
            authSubmit.disabled = false;
            authSubmit.textContent = 'Sign Up';
            return;
          }
          toast('Account created! Check your email to confirm (if required), then sign in.', 'added');
          // Switch to login
          isSignup = false;
          authToggleBtn.click();
        } else {
          result = await supabase.auth.signInWithPassword({ email, password });
          if (result.error) throw result.error;
        }
      } catch (err) {
        showAuthError(err.message);
        authSubmit.disabled = false;
        authSubmit.textContent = isSignup ? 'Sign Up' : 'Sign In';
        return;
      }

      authSubmit.disabled = false;
      authSubmit.textContent = isSignup ? 'Sign Up' : 'Sign In';
    });

    // === User dropdown ===
    userBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('open');
    });

    document.addEventListener('click', () => userDropdown.classList.remove('open'));

    // Sign out
    signOutBtn.addEventListener('click', async () => {
      userDropdown.classList.remove('open');
      await supabase.auth.signOut();
    });

    // Delete account
    deleteAccountBtn.addEventListener('click', async () => {
      userDropdown.classList.remove('open');
      const ok = await showConfirm(
        'Are you sure? This permanently deletes your account and all your data. This cannot be undone.'
      );
      if (!ok) return;

      setLoading(true);
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('No session');

        const res = await fetch(
          'https://rqhrsildsoxeadchozui.supabase.co/functions/v1/delete-account',
          { method: 'POST', headers: { 'Authorization': `Bearer ${session.access_token}` } }
        );

        if (!res.ok) {
          // Fallback: try RPC
          const { error: rpcErr } = await supabase.rpc('delete_my_account');
          if (rpcErr) throw new Error(rpcErr.message);
        }
      } catch (err) {
        setLoading(false);
        toast(`Failed to delete account: ${err.message}`, 'deleted');
        return;
      }
      await supabase.auth.signOut();
      handleAuthChange(null);
    });

    // === Supabase auth listener ===
    supabase.auth.getSession().then(({ data: { session } }) => {
      currentUser = session?.user ?? null;
      handleAuthChange(currentUser);
    });

    supabase.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user ?? null;
      if (event === 'SIGNED_OUT' || event === 'USER_DELETED') {
        handleAuthChange(null);
      } else if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
        handleAuthChange(currentUser);
      }
    });

    function subscribeRealtime(user, admin) {
      if (realtimeChannel) supabase.removeChannel(realtimeChannel);
      const cfg = { event: '*', schema: 'public', table: 'items' };
      if (!admin && user) cfg.filter = `user_id=eq.${user.id}`;
      realtimeChannel = supabase
        .channel('items-changes')
        .on('postgres_changes', cfg, () => loadItems())
        .subscribe();
    }

    async function handleAuthChange(user) {
      setLoading(false);
      if (user) {
        showApp();
        updateUserUI(user);
        await checkAdmin(user);
        subscribeRealtime(user, isAdmin);
        loadItems();
      } else {
        if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        showAuth();
      }
    }

    async function checkAdmin(user) {
      if (!user) { setAdminUI(false); return; }
      const { data, error } = await supabase
        .from('admins')
        .select('email')
        .eq('email', user.email)
        .maybeSingle();
      setAdminUI(!!data);
    }

    // === Dashboard logic ===
    function classify(text, scheduledAt) {
      const t = text.trim();
      const m = t.match(/^(did:|x:|\/done)\s*(.*)/i);
      if (m && m[2]) {
        return { text: m[2] || m[0], entry_type: 'ACTIVITY_LOG', status: 'COMPLETED', completed_at: new Date().toISOString() };
      }
      return { text: t, entry_type: 'TODO', status: 'PENDING', scheduled_at: scheduledAt || null, completed_at: null };
    }

    async function deleteItem(id) {
      const ok = await showConfirm('Delete this item?');
      if (!ok) return;
      await supabase.from('items').delete().eq('id', id).eq('user_id', currentUser.id);
      toast('Deleted', 'deleted');
      loadItems();
    }

    async function completeItem(id) {
      await supabase
        .from('items')
        .update({ status: 'COMPLETED', completed_at: new Date().toISOString() })
        .eq('id', id).eq('user_id', currentUser.id);
      toast('Task completed');
      loadItems();
    }

    function createEmpty(svg, text, sub) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.innerHTML = svg +
        `<div class="empty-text">${esc(text)}</div>` +
        `<div class="empty-sub">${esc(sub)}</div>`;
      return d;
    }

    const DONE_EMPTY = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    const TODO_EMPTY = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';

    function createItem(item) {
      const div = document.createElement('div');
      div.className = item.status === 'PENDING' ? 'item pending' : 'item done';
      div.dataset.id = item.id;

      if (item.status === 'PENDING') {
        div.innerHTML = `
          <input type="checkbox" class="item-check">
          <span class="item-text">${esc(item.text)}</span>
          <span class="item-meta">${item.scheduled_at ? new Date(item.scheduled_at).toLocaleDateString() : ''}</span>
          <button class="btn-icon danger" data-action="delete" title="Delete">✕</button>
        `;
        div.querySelector('.item-check').addEventListener('change', () => completeItem(item.id));
        div.querySelector('[data-action="delete"]').addEventListener('click', e => {
          e.stopPropagation();
          deleteItem(item.id);
        });
      } else {
        div.innerHTML = `
          <span class="item-marker">✓</span>
          <span class="item-text">${esc(item.text)}</span>
          <span class="item-meta">${fmtRel(item.completed_at)}</span>
          <button class="btn-icon danger" data-action="delete" title="Delete">✕</button>
        `;
        div.querySelector('[data-action="delete"]').addEventListener('click', e => {
          e.stopPropagation();
          deleteItem(item.id);
        });
      }
      return div;
    }

    async function loadItems() {
      if (!currentUser) return;

      const selStart = new Date(selectedDate + 'T00:00:00');
      const selEnd = new Date(selectedDate + 'T23:59:59.999Z');
      const selStartIso = selStart.toISOString();
      const selEndIso = selEnd.toISOString();

      const { data, error } = await supabase
        .from('items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) { console.error(error); return; }

      const items = data || [];

      // Build set of dates that have tasks (for week strip dots)
      const taskDates = new Set();
      items.forEach(i => {
        if (i.completed_at) taskDates.add(i.completed_at.slice(0, 10));
        if (i.scheduled_at) taskDates.add(i.scheduled_at.slice(0, 10));
        if (i.created_at) taskDates.add(i.created_at.slice(0, 10));
      });

      const done = items.filter(i =>
        i.status === 'COMPLETED' && i.completed_at && i.completed_at >= selStartIso && i.completed_at <= selEndIso
      );
      const pending = items.filter(i =>
        i.entry_type === 'TODO' && i.status === 'PENDING' &&
        (i.scheduled_at == null || (i.scheduled_at >= selStartIso && i.scheduled_at <= selEndIso))
      );

      done.sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
      pending.sort((a, b) => (a.scheduled_at || '') > (b.scheduled_at || '') ? 1 : -1);

      // Update column titles
      const isToday = selectedDate === today();
      doneColTitle.textContent = isToday ? 'What I Did Today' : `Done on ${fmtDateFull(selStart)}`;
      pendingColTitle.textContent = isToday ? 'Scheduled' : `Scheduled for ${fmtDateFull(selStart)}`;

      completedList.innerHTML = '';
      if (done.length === 0) {
        completedList.appendChild(createEmpty(DONE_EMPTY, isToday ? 'Nothing logged yet today' : `Nothing logged on ${fmtDateLabel(selStart)}`, 'Activities appear here after you log them'));
      } else {
        done.forEach(item => completedList.appendChild(createItem(item)));
      }

      pendingList.innerHTML = '';
      if (pending.length === 0) {
        pendingList.appendChild(createEmpty(TODO_EMPTY, isToday ? 'No tasks scheduled' : `No tasks for ${fmtDateLabel(selStart)}`, 'Add one above and it\'ll show up here'));
      } else {
        pending.forEach(item => pendingList.appendChild(createItem(item)));
      }

      doneCount.textContent = done.length;
      pendingCount.textContent = pending.length;
      doneBadge.textContent = done.length;
      pendingBadge.textContent = pending.length;
      $('statDone').dataset.count = done.length;
      $('statPending').dataset.count = pending.length;

      const total = done.length + pending.length;
      if (total > 0) {
        const pct = Math.round((done.length / total) * 100);
        progressArc.style.strokeDashoffset = 69.1 - (69.1 * pct) / 100;
        progressPct.textContent = `${pct}%`;
      } else {
        progressArc.style.strokeDashoffset = 69.1;
        progressPct.textContent = '0%';
      }

      renderWeekStrip(taskDates);
    }

    async function addItem() {
      const raw = taskInput.value.trim();
      if (!raw) return;

      const scheduledAt = taskDate.value
        ? new Date(taskDate.value + 'T00:00:00').toISOString()
        : null;
      const item = classify(raw, scheduledAt);
      const { error } = await supabase.from('items').insert({ ...item, user_id: currentUser.id });
      if (error) {
        console.error(error);
        toast('Error saving task', 'deleted');
        return;
      }
      taskInput.value = '';
      taskInput.focus();
      toast(item.entry_type === 'TODO' ? 'Task added' : 'Activity logged', 'added');
      loadItems();
    }

    addBtn.addEventListener('click', addItem);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        taskInput.focus();
      }
    });
    }

  </script>
</body>
</html>
