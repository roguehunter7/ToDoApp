<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseTask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <style>
    @layer reset, theme, base, components, utilities;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { min-height: 100dvh; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      input, button { font: inherit; }
      button { cursor: pointer; }
      ul { list-style: none; }
    }

    @layer theme {
      :root {
        --surface-0: #0a0a0f;
        --surface-1: #111118;
        --surface-2: #181825;
        --surface-3: #1e1e30;
        --border: #2a2a40;
        --border-hover: #3a3a55;
        --text: #e4e4ed;
        --text-muted: #7c7c94;
        --text-dim: #55556b;
        --accent: #34d399;
        --accent-glow: rgba(52, 211, 153, .15);
        --accent-soft: #059669;
        --cyan: #22d3ee;
        --cyan-glow: rgba(34, 211, 238, .12);
        --red: #f87171;
        --radius: 12px;
        --radius-sm: 8px;
        --transition: .2s cubic-bezier(.4, 0, .2, 1);
        --bounce: .45s cubic-bezier(.34, 1.56, .64, 1);
        interpolate-size: allow-keywords;
      }
    }

    @layer base {
      body {
        background: var(--surface-0);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      ::selection { background: var(--accent); color: var(--surface-0); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    }

    @layer components {
      /* App shell */
      .app { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }

      @container (width >= 640px) {
        .app { padding: 32px 24px; }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 32px;
        container-type: inline-size;
      }

      .header-logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -.03em;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-sub {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 4px;
        font-weight: 400;
      }

      /* Stats bar */
      .stats {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 100px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        transition: var(--transition);
      }

      .stat[data-count="0"] { opacity: .55; }
      .stat-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 700;
        transition: var(--bounce);
      }

      .stat-badge[data-type="done"] { background: var(--accent-glow); color: var(--accent); }
      .stat-badge[data-type="pending"] { background: var(--cyan-glow); color: var(--cyan); }

      /* Input area */
      .input-area {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        container-type: inline-size;
      }

      .input-wrap {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: var(--transition);
      }

      .input-wrap:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .input-wrap input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        padding: 14px 16px;
        color: var(--text);
        font-size: 14px;
        font-weight: 400;
      }

      .input-wrap input::placeholder { color: var(--text-dim); }
      .input-hint {
        display: none;
        align-items: center;
        gap: 4px;
        padding-right: 12px;
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 500;
      }

      @container (width >= 400px) {
        .input-hint { display: flex; }
      }

      .input-hint kbd {
        padding: 2px 5px;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 10px;
        font-family: inherit;
        color: var(--text-muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 14px 20px;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--surface-0);
      }
      .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .btn-primary:active { transform: translateY(0); }

      .btn-icon {
        width: 32px; height: 32px;
        padding: 0;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-dim);
        font-size: 16px;
        line-height: 1;
        transition: var(--transition);
      }
      .btn-icon:hover { background: var(--surface-3); color: var(--text-muted); }

      .btn-icon.danger:hover { background: rgba(248, 113, 113, .12); color: var(--red); }

      /* Dashboard grid */
      .dashboard {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (width >= 768px) {
        .dashboard { grid-template-columns: 1fr 1fr; }
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 2px;
        container-type: inline-size;
      }

      .column-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 4px 16px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -.01em;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }

      .column-header .icon { font-size: 16px; }
      .column-header .count {
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-dim);
      }

      /* Items */
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: var(--transition);
        view-transition-name: auto;
        @starting-style { opacity: 0; transform: translateY(8px) scale(.97); }
      }

      .item:hover {
        border-color: var(--border-hover);
        background: var(--surface-2);
      }

      .item-text {
        flex: 1;
        font-size: 14px;
        line-height: 1.45;
        word-break: break-word;
        min-width: 0;
      }

      .item-meta {
        font-size: 11px;
        color: var(--text-dim);
        white-space: nowrap;
        font-weight: 500;
      }

      /* Pending items */
      .item.pending .item-text { color: var(--text); }

      .item.pending .item-check {
        appearance: none;
        width: 20px; height: 20px;
        flex-shrink: 0;
        border: 2px solid var(--border-hover);
        border-radius: 6px;
        background: var(--surface-2);
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .item.pending .item-check:checked {
        background: var(--accent);
        border-color: var(--accent);
      }

      .item.pending .item-check:checked::after {
        content: '';
        width: 6px; height: 10px;
        border: solid var(--surface-0);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        position: absolute;
        top: 2px;
      }

      .item.pending .item-check:hover { border-color: var(--accent); }

      /* Completed items */
      .item.done { opacity: .85; }

      .item.done .item-text {
        color: var(--text-muted);
        text-decoration: line-through;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1.5px;
      }

      .item.done .item-marker {
        width: 20px; height: 20px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: var(--accent-glow);
        font-size: 11px;
      }

      /* Empty state */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
        gap: 12px;
      }

      .empty svg { opacity: .3; }
      .empty-text { color: var(--text-dim); font-size: 13px; font-weight: 500; }
      .empty-sub { color: var(--text-dim); font-size: 12px; opacity: .65; }

      /* Toast */
      .toast-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        translate: -50% 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }

      .toast {
        padding: 12px 20px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
        pointer-events: auto;
        animation: toast-in var(--bounce), toast-out .25s ease forwards;
        animation-duration: var(--bounce), .25s;
        animation-delay: 0s, 2.5s;
        animation-fill-mode: forwards, forwards;
      }

      @keyframes toast-in {
        from { opacity: 0; transform: translateY(16px) scale(.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes toast-out {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to { opacity: 0; transform: translateY(-8px) scale(.95); }
      }

      /* Progress ring mini */
      .progress-ring {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .progress-ring svg { transform: rotate(-90deg); }

      /* Toast animations flush */
      .toast.done { border-left: 3px solid var(--accent); }
      .toast.added { border-left: 3px solid var(--cyan); }
      .toast.deleted { border-left: 3px solid var(--red); }
    }

    /* View transitions */
    @view-transition { navigation: auto; }

    /* Animate items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-list > :nth-child(1) { animation: slide-in .3s ease both; }
    .item-list > :nth-child(2) { animation: slide-in .3s ease both; animation-delay: .03s; }
    .item-list > :nth-child(3) { animation: slide-in .3s ease both; animation-delay: .06s; }
    .item-list > :nth-child(4) { animation: slide-in .3s ease both; animation-delay: .09s; }
    .item-list > :nth-child(5) { animation: slide-in .3s ease both; animation-delay: .12s; }
    .item-list > :nth-child(6) { animation: slide-in .3s ease both; animation-delay: .15s; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header-logo">PulseTask</h1>
      <p class="header-sub">Track what you do. Own your day.</p>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div class="stat" id="statDone">
        <span>✅</span> Done today <span class="stat-badge" id="doneBadge" data-type="done">0</span>
      </div>
      <div class="stat" id="statPending">
        <span>📋</span> Left to do <span class="stat-badge" id="pendingBadge" data-type="pending">0</span>
      </div>
      <div class="progress-ring" id="progressRing">
        <svg width="28" height="28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle id="progressArc" cx="14" cy="14" r="11" fill="none"
            stroke="url(#prog-grad)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="69.1" stroke-dashoffset="69.1"/>
          <defs><linearGradient id="prog-grad" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--cyan)"/>
          </linearGradient></defs>
        </svg>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap">
        <input id="taskInput" type="text"
          placeholder='Type a task… or use "did:", "x:", "/done " to log an activity'
          autofocus>
        <div class="input-hint">
          <kbd>↵</kbd> add
        </div>
      </div>
      <button class="btn btn-primary" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add
      </button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
      <!-- Done column -->
      <div class="column">
        <div class="column-header">
          <span class="icon">✅</span> What I Did Today
          <span class="count" id="doneCount">0</span>
        </div>
        <div class="item-list" id="completedList">
          <div class="empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <div class="empty-text">Nothing logged yet today</div>
            <div class="empty-sub">Activities appear here after you log them</div>
          </div>
        </div>
      </div>

      <!-- Pending column -->
      <div class="column">
        <div class="column-header">
          <span class="icon">📋</span> Left To Do
          <span class="count" id="pendingCount">0</span>
        </div>
        <div class="item-list" id="pendingList">
          <div class="empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <div class="empty-text">No pending tasks</div>
            <div class="empty-sub">Add one above and it'll show up here</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const supabase = window.supabase.createClient(
      'https://rqhrsildsoxeadchozui.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxaHJzaWxkc294ZWFkY2hvenVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzEwODUsImV4cCI6MjEwMDU0NzA4NX0.SyzfABMYO2APB-zpZp3FYHv2kKLOXEiUjIdlP3V3VzU'
    );

    const $ = id => document.getElementById(id);
    const taskInput = $('taskInput');
    const addBtn = $('addBtn');
    const completedList = $('completedList');
    const pendingList = $('pendingList');
    const doneCount = $('doneCount');
    const pendingCount = $('pendingCount');
    const doneBadge = $('doneBadge');
    const pendingBadge = $('pendingBadge');
    const progressArc = $('progressArc');
    const progressPct = $('progressPct');
    const toastContainer = $('toastContainer');

    const CIRCUMFERENCE = 69.1;

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function fmtRel(ts) {
      if (!ts) return '';
      const diff = Date.now() - new Date(ts).getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return `${Math.round(diff / 60000)}m ago`;
      return fmtTime(ts);
    }

    function toast(msg, type = 'done') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    function classify(text) {
      const t = text.trim();
      const m = t.match(/^(did:|x:|\/done)\s*(.*)/i);
      if (m) {
        return { text: m[2] || m[0], entry_type: 'ACTIVITY_LOG', status: 'COMPLETED', completed_at: new Date().toISOString() };
      }
      return { text: t, entry_type: 'TODO', status: 'PENDING', scheduled_at: null, completed_at: null };
    }

    // --- Delete handler ---
    async function deleteItem(id) {
      await supabase.from('items').delete().eq('id', id);
      toast('Deleted', 'deleted');
      loadItems();
    }

    // --- Complete handler ---
    async function completeItem(id) {
      await supabase
        .from('items')
        .update({ status: 'COMPLETED', completed_at: new Date().toISOString() })
        .eq('id', id);
      toast('Task completed');
      loadItems();
    }

    // --- Render helpers ---
    function createEmpty(svg, text, sub) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.innerHTML = svg +
        `<div class="empty-text">${esc(text)}</div>` +
        `<div class="empty-sub">${esc(sub)}</div>`;
      return d;
    }

    function createItem(item) {
      const div = document.createElement('div');
      div.className = item.entry_type === 'TODO' && item.status === 'PENDING' ? 'item pending' : 'item done';
      div.dataset.id = item.id;

      if (item.status === 'PENDING') {
        div.innerHTML = `
          <input type="checkbox" class="item-check">
          <span class="item-text">${esc(item.text)}</span>
          <span class="item-meta">${item.scheduled_at ? new Date(item.scheduled_at).toLocaleDateString() : ''}</span>
          <button class="btn-icon danger" data-action="delete" title="Delete">✕</button>
        `;
        div.querySelector('.item-check').addEventListener('change', () => completeItem(item.id));
        div.querySelector('[data-action="delete"]').addEventListener('click', e => {
          e.stopPropagation();
          deleteItem(item.id);
        });
      } else {
        div.innerHTML = `
          <span class="item-marker">✓</span>
          <span class="item-text">${esc(item.text)}</span>
          <span class="item-meta">${fmtRel(item.completed_at)}</span>
          <button class="btn-icon danger" data-action="delete" title="Delete">✕</button>
        `;
        div.querySelector('[data-action="delete"]').addEventListener('click', e => {
          e.stopPropagation();
          deleteItem(item.id);
        });
      }
      return div;
    }

    function renderEmpty(container, type) {
      if (type === 'done') {
        container.appendChild(createEmpty(
          '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
          'Nothing logged yet today',
          'Activities appear here after you log them'
        ));
      } else {
        container.appendChild(createEmpty(
          '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
          'No pending tasks',
          'Add one above and it\'ll show up here'
        ));
      }
    }

    // --- Load ---
    async function loadItems() {
      const todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);
      const todayStr = todayStart.toISOString();

      const { data, error } = await supabase
        .from('items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) { console.error(error); return; }

      const items = data || [];
      const done = items.filter(i => i.status === 'COMPLETED' && i.completed_at && i.completed_at >= todayStr);
      const pending = items.filter(i => i.entry_type === 'TODO' && i.status === 'PENDING');

      // Sort done by completed_at descending
      done.sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));

      // Build completed list
      completedList.innerHTML = '';
      if (done.length === 0) {
        renderEmpty(completedList, 'done');
      } else {
        done.forEach(item => completedList.appendChild(createItem(item)));
      }

      // Build pending list
      pendingList.innerHTML = '';
      if (pending.length === 0) {
        renderEmpty(pendingList, 'pending');
      } else {
        pending.forEach(item => pendingList.appendChild(createItem(item)));
      }

      // Update counts
      doneCount.textContent = done.length;
      pendingCount.textContent = pending.length;
      doneBadge.textContent = done.length;
      pendingBadge.textContent = pending.length;
      $('statDone').dataset.count = done.length;
      $('statPending').dataset.count = pending.length;

      // Progress ring
      const total = done.length + pending.length;
      if (total > 0) {
        const pct = Math.round((done.length / total) * 100);
        const offset = CIRCUMFERENCE - (CIRCUMFERENCE * pct) / 100;
        progressArc.style.strokeDashoffset = offset;
        progressPct.textContent = `${pct}%`;
      } else {
        progressArc.style.strokeDashoffset = CIRCUMFERENCE;
        progressPct.textContent = '0%';
      }
    }

    // --- Add ---
    async function addItem() {
      const raw = taskInput.value.trim();
      if (!raw) return;

      const item = classify(raw);
      const { error } = await supabase.from('items').insert(item);
      if (error) {
        console.error(error);
        toast('Error saving task', 'deleted');
        return;
      }
      taskInput.value = '';
      taskInput.focus();
      toast(item.entry_type === 'TODO' ? 'Task added' : 'Activity logged', 'added');
      loadItems();
    }

    // --- Events ---
    addBtn.addEventListener('click', addItem);
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        taskInput.focus();
      }
    });

    // Supabase realtime
    supabase
      .channel('items-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, loadItems)
      .subscribe();

    loadItems();
  </script>
</body>
</html>
