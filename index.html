<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark</title>
  <meta name="theme-color" content="#141410">
  <meta name="description" content="Minimal todo app with calendar scheduling">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
      script-src 'self' https://unpkg.com 'unsafe-inline';
      connect-src 'self' https://rqhrsildsoxeadchozui.supabase.co https://*.supabase.co wss://*.supabase.co;
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data:;
      manifest-src 'self'">
  <link rel="manifest" href="/ToDoApp/manifest.json">
  <link rel="icon" href="/ToDoApp/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/ToDoApp/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin="anonymous"
    integrity="sha384-M65KxMm/JqBppck6onbmAgPVMBHrmPCf1L17Q+71EcvI9/VVI8j5cqoxQf6lj6h2"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="auth-logo">Daymark</div>
      <p class="auth-sub" id="authSub">Sign in to continue</p>

      <div class="auth-error" id="authError" role="alert"></div>

      <form id="authForm" novalidate>
        <div class="auth-field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>
        <button class="auth-submit" id="authSubmit" type="submit">Sign In</button>
      </form>

      <div class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span>
        <button id="authToggleBtn">Sign Up</button>
      </div>
    </div>
  </div>

  <main id="app" class="app" style="display:none">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">Daymark</span>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">☀️</button>
      </div>
      <div class="topbar-right">
        <button class="user-btn" id="userBtn">
          <span class="user-avatar" id="userAvatar">?</span>
          <span class="user-email" id="userEmail">user@email.com</span>
          <span style="font-size:10px">▾</span>
        </button>
        <div class="dropdown" id="userDropdown">
          <div class="dropdown-header">
            <div class="dropdown-email" id="dropEmail">user@email.com</div>
            <div class="dropdown-role" id="dropRole" style="display:none">Admin</div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="exportBtn">
            <span>📥</span> Export Data
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="signOutBtn">
            <span>🚪</span> Sign Out
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="deleteAccountBtn">
            <span>🗑</span> Delete Account
          </button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat" id="statDone">
        <span aria-hidden="true">✅</span> Done today <span class="stat-badge" id="doneBadge" data-type="done">0</span>
      </div>
      <div class="stat" id="statPending">
        <span aria-hidden="true">📋</span> Left to do <span class="stat-badge" id="pendingBadge" data-type="pending">0</span>
      </div>
      <div class="progress-ring" id="reportBtn" role="button" tabindex="0" title="View summaries" aria-haspopup="dialog">
        <svg width="28" height="28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--border)" stroke-width="3"/>
          <circle id="progressArc" cx="14" cy="14" r="11" fill="none"
            stroke="url(#prog-grad)" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="69.1" stroke-dashoffset="69.1"/>
          <defs><linearGradient id="prog-grad" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--pulse)"/>
          </linearGradient></defs>
        </svg>
        <span id="progressPct">0%</span>
        <span class="report-cta">Reports</span>
      </div>
    </div>

    <div class="date-hero">
      <span class="date-hero-day" id="heroDay">Saturday</span>
      <span class="date-hero-date" id="heroDate">July 25, 2026</span>
    </div>
    <div class="week-strip">
      <button class="week-nav" id="weekPrev" title="Previous week">‹</button>
      <span class="week-label" id="weekLabel">Jul 21 – Jul 27, 2026</span>
      <div class="week-days" id="weekDays"></div>
      <button class="week-nav" id="weekNext" title="Next week">›</button>
    </div>

    <div class="input-area">
      <div class="input-modes" id="inputModes" role="tablist">
        <button class="input-mode active" data-mode="todo" role="tab" aria-selected="true">📝 Task</button>
        <button class="input-mode" data-mode="done" role="tab" aria-selected="false">✨ Activity</button>
      </div>
      <div class="input-wrap">
        <input id="taskInput" type="text"
          placeholder="What do you need to do?" aria-label="New task"
          autofocus>
        <div class="input-hint">
          <kbd>⌘K</kbd> <kbd>↵</kbd>
        </div>
      </div>
      <div class="input-row">
        <input type="date" id="taskDate" class="date-input" title="Schedule for date" aria-label="Schedule for date">
        <select id="recurrenceSelect" class="date-input recurrence-input" title="Repeat" aria-label="Repeat">
          <option value="">No repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
        <button class="btn btn-primary" id="addBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add
        </button>
      </div>
      <div class="input-extras">
        <button class="btn-text" id="tagToggle" style="font-size:12px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:4px 0">+ tags</button>
        <input type="text" id="tagsField" placeholder="work, personal, errands" aria-label="Tags (comma-separated)" style="display:none;width:100%;padding:8px 10px;background:var(--surface-2);border:var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none;margin-top:4px">
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-text="Buy groceries"><span aria-hidden="true">🛒</span> Buy groceries</button>
        <button class="chip" data-text="Read for 20 min"><span aria-hidden="true">📖</span> Read for 20 min</button>
        <button class="chip" data-text="Gym workout"><span aria-hidden="true">💪</span> Gym workout</button>
      </div>
    </div>

    <div class="dashboard">
      <div id="tagFilterBar" style="display:none;flex-wrap:wrap;gap:6px;margin-bottom:12px;grid-column:1/-1"></div>
      <div class="column">
        <div class="column-header">
          <span class="icon">✅</span> <span id="doneColTitle">What I Did Today</span>
          <span class="count" id="doneCount">0</span>
        </div>
        <div class="item-list" id="completedList"></div>
      </div>
      <div class="column">
        <div class="column-header">
          <span class="icon">📋</span> <span id="pendingColTitle">Scheduled</span>
          <span class="count" id="pendingCount">0</span>
        </div>
        <div class="item-list" id="pendingList"></div>
      </div>
    </div>
  </main>

  <div id="loadingScreen" role="progressbar" aria-label="Loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-0);z-index:999">
    <div class="spinner"></div>
  </div>

  <dialog id="confirmDialog" aria-labelledby="confirmMsg">
    <p id="confirmMsg" style="font-size:14px;line-height:1.5;margin-bottom:20px;font-weight:500"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-outline" id="confirmCancel">Cancel</button>
      <button class="btn-outline danger" id="confirmOk">Delete</button>
    </div>
  </dialog>

  <dialog id="reportDialog" aria-labelledby="reportDialogTitle">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <span id="reportDialogTitle" style="font-size:16px;font-weight:700">Reports & Summaries</span>
      <button class="btn-icon" id="reportClose" title="Close">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn-outline" data-period="daily" style="font-size:12px">📅 Today</button>
      <button class="btn-outline" data-period="weekly" style="font-size:12px">📆 This Week</button>
      <button class="btn-outline" data-period="monthly" style="font-size:12px">🗓 This Month</button>
    </div>
    <div id="reportLoading" style="display:none;text-align:center;padding:24px">
      <div class="spinner"></div>
      <div style="font-size:13px;color:var(--text-muted);margin-top:8px">Generating summary…</div>
    </div>
    <div id="reportResult" style="display:none">
      <div id="reportSummary" style="font-size:14px;line-height:1.6;padding:16px;background:var(--surface-1);border-radius:var(--radius-sm);margin-bottom:12px"></div>
      <div id="reportBullets" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px"></div>
      <div id="reportStats" style="font-size:12px;color:var(--text-muted);padding:8px 0;border-top:var(--border)"></div>
    </div>
    <div id="reportHistory" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px">Previously generated:</div>
    </div>
  </dialog>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
</body>
</html>
